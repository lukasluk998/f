[package]
name = "f"
version = "3.4.0"
edition = "2021"

[[bin]]
name = "rust-game-cheat"
path = "src/main.rs"

[[bin]]
name = "dump_offsets"
path = "src/bin/dump_offsets.rs"

[dependencies]
winapi = { version = "0.3", features = ["winuser", "winnt", "processthreadsapi", "memoryapi", "handleapi", "tlhelp32", "psapi", "wingdi", "fileapi", "ioapiset", "debugapi", "impl-default"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
toml = "0.8"
rand = "0.8"

[lib]
name = "f"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
